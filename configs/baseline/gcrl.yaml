baseline:
  name: gcrl
  algorithm: GCRL
  implementation: pytorch_offline_goal_conditioned_iql
  observation: control_state+desired_goal
  offline_only: true
  data: null
  hidden: 256
  depth: 3
  batch_size: 256
  epochs: 50
  gradient_updates: null
  learning_rate: 0.0003
  discount: 0.99
  expectile: 0.7
  advantage_temperature: 3.0
  max_advantage_weight: 100.0
  target_tau: 0.005
  grad_clip: 10.0
  her_ratio: 0.5
  # Dense public goal distance is training-only; evaluation always reports the
  # native environment reward. Goal-free tasks retain their native rewards.
  goal_reward_type: dense
  reward_scale: 0.0
