env:
  name: humanoid_push
  env_id: h1hand-push-v0
  image_size: [96, 96]
  state_size: 512
  proprio_size: 151
  action_size: 61
  goal_size: 3
  action_adapter_achieved_goal_slice: [157, 160]
  episode_horizon: 500
  success_info_keys: [success, is_success, reward_success]
  residual_scale: 1.0
  nominal_observation_size: 151
  proprio_slice: [0, 151]
  paired_data:
    expert_fraction: 0.8
    expert_noise: 0.03
    legacy_expert_action_rms_threshold: 0.15
  passive:
    friction_multiplier: [0.8, 1.2]
    damping_multiplier: [0.9, 1.1]
    actuator_strength_multiplier: [0.9, 1.1]
    impulse_std: 0.05
  state_indices: &push_indices
    proprio: []
    upright: []
    hand_position: []
    object_position: []
    fall: []
    goal: []
    achieved_goal: []
  scorer:
    indices: *push_indices
    slices: {torso_height: [2, 3], hand_position: [151, 154], object_position: [157, 160]}
    fall_height: 0.2
    weights: {goal: 1.0, approach: 0.1, upright: 0.5, fall: 10.0, control: 0.001}
  train_ranges:
    friction_multiplier: [0.8, 1.2]
    damping_multiplier: [0.9, 1.1]
    actuator_strength_multiplier: [0.9, 1.1]

model:
  state_prior:
    observation:
      type: transformer
      d_model: 256
      n_layers: 4
      n_heads: 8

planner:
  num_candidates: 64
  horizon: 2

eval:
  proposal_std_scale: 0.03
