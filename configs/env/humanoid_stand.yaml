env:
  name: humanoid_stand
  env_id: h1hand-stand-v0
  image_size: [96, 96]
  state_size: 512
  proprio_size: 151
  action_size: 61
  goal_size: 0
  episode_horizon: 500
  episode_success_mode: return
  success_return_threshold: 800
  success_return_native_horizon: 1000
  nominal_target_offset: [0.3, 0.3, 0.9]
  residual_scale: 0.25
  nominal_observation_size: 151
  proprio_slice: [0, 151]
  paired_data:
    expert_fraction: 0.8
    expert_noise: 0.03
    legacy_expert_action_rms_threshold: 0.15
  passive:
    friction_multiplier: [0.8, 1.2]
    damping_multiplier: [0.9, 1.1]
    actuator_strength_multiplier: [0.9, 1.1]
    impulse_std: 0.05
  state_indices: &stand_indices
    proprio: []
    torso_height: []
    upright: []
    joint_velocity: []
    root_velocity: []
    fall: []
    goal: []
    achieved_goal: []
  scorer:
    indices: *stand_indices
    slices: {torso_height: [2, 3], joint_velocity: [76, 151], root_velocity: [76, 79]}
    fall_height: 0.2
    weights: {height: 1.0, upright: 1.0, velocity: 0.01, fall: 10.0, control: 0.001}
  train_ranges: &humanoid_ranges
    friction_multiplier: [0.8, 1.2]
    damping_multiplier: [0.9, 1.1]
    actuator_strength_multiplier: [0.9, 1.1]

model:
  state_prior:
    observation: &humanoid_observation_prior
      type: transformer
      d_model: 256
      n_layers: 4
      n_heads: 8

planner:
  # Stand has no task goal to search over; perturbing the stable nominal
  # proposal only hurts balance.  K=1 retains the model rollout and anchor.
  num_candidates: 1
  horizon: 2

eval:
  proposal_std_scale: 0.01
