[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-robotics-planner"
version = "0.1.0"
description = "FunctionAlignmentWM unified robotics planning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "Pillow>=9.0",
  "matplotlib>=3.7",
  "imageio>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
fetch = ["gymnasium==0.29.1", "mujoco==3.1.6"]
humanoid = ["gymnasium==0.29.1", "mujoco==3.1.6"]
# Stable-Baselines3 is retained for the shared Humanoid nominal-controller
# infrastructure; the GCRL baseline itself is the PyTorch offline IQL above.
gcrl = ["gymnasium==0.29.1", "stable-baselines3==2.3.2"]
external-baselines = [
  "einops==0.4.1",
  "torchvision>=0.16",
]
data = ["h5py>=3.9", "zarr>=2.16"]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires optional simulator dependencies"]
